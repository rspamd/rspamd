# lookalike_sender module configuration.
#
# Install: place this file at $LOCAL_CONFDIR/local.d/lookalike_sender.conf (usually
# /etc/rspamd/local.d/lookalike_sender.conf) and set the protected set to the brands and
# domains you want defended. The module is disabled until `protected` is non-empty.
#
# See README.md for installing the plugin (src/plugins/lua/lookalike_sender.lua) and the
# library (lualib/lua_lookalike/).

lookalike_sender {
  # Brand names and/or registrable domains to defend. A sender or URL host that imitates one
  # of these (confusable skeleton, typo distance, brand-affixed or lure domain, embedded
  # domain, ...) is flagged. Include both the human name and the domain for best results.
  #
  # protected = ["example.com", "Example", "chase.com", "Chase", "paypal.com", "PayPal"];
  protected = [];

  # Report a sender/host whose logistic impersonation probability reaches this threshold.
  score_threshold = 0.5;

  # Maximum edit distance for the skeleton/typo checks (length-scaled internally).
  max_distance = 2;

  # Default symbol weights (override here or in local.d/groups.conf as usual).
  weight_sender_lookalike = 7.0;
  weight_url_lookalike = 5.0;
  weight_embedded = 5.0;
  weight_sender_score = 4.0;
  weight_url_score = 3.0;
}
