# Please don't modify this file as your changes might be overwritten with
# the next update.
#
# You can modify 'local.d/phishing.conf' to add and merge
# parameters defined inside this section
#
# You can modify 'override.d/phishing.conf' to strictly override all
# parameters defined inside this section
#
# See https://rspamd.com/doc/faq.html#what-are-the-locald-and-overrided-directories
# for details
#
# Module documentation can be found at  https://rspamd.com/doc/modules/phishing.html

phishing {
  symbol = "PHISHING";
  # Raw displayed-domain mismatch, retained even when scoring is excluded.
  mismatch_symbol = "URL_DISPLAY_MISMATCH";
  # Unknown wrapper whose single query-target chain matches the displayed domain.
  # Query parameters are untrusted. Observe at score zero until locally calibrated.
  query_symbol = "PHISHING_QUERY";
  rewrite_symbol = "PHISHING_REWRITE_ALLOWED";

  # Explicit rewrite permissions. Unlike redirectors.inc (redirector discovery),
  # these maps express trust. The shipped map covers selected security wrappers.
  # Entries use lowercase ASCII/punycode domain names.
  #
  # Glob map of globally trusted wrapper hosts. Bare names match exact hosts;
  # use *.example.net explicitly to trust subdomains.
  trusted_redirectors = "$CONFDIR/maps.d/phishing_trusted_redirectors.inc";
  #
  # Hash map: displayed domain -> allowed wrapper domains, for example:
  #   example.com wrapper-one.net wrapper-two.org
  # rewrite_domains = "$LOCAL_CONFDIR/local.d/maps.d/phishing_rewrite_domains.map";
  #
  # Hash map expressing the same permission in the other lookup direction:
  #   wrapper-one.net example.com other.org
  # rewrite_redirectors = "$LOCAL_CONFDIR/local.d/maps.d/phishing_rewrite_redirectors.map";
  #
  # Pair-map values are separated by whitespace or commas. Keys and values
  # match exact hostnames or registrable domains (covering their subdomains).
  # Allowing example.com to use wrapper-one.net never allows a link displaying
  # wrapper-one.net to point to example.com without a separate permission.
  # Explicit permissions allow strict-domain rewrites too, but retain the raw
  # mismatch and feed checks. Resolved destination mismatches take precedence.

  # Compatibility with the historical redirector exemption during migration.
  # This discovery list is broader than the trusted map above. Set
  # legacy_redirectors = false in local.d/phishing.conf to use explicit trust only.
  # Retains REDIRECTOR_FALSE and the raw mismatch; independent feeds still apply.
  legacy_redirectors = [
    "{= env.MAPS_MIRROR | default "https://maps.rspamd.com" =}/rspamd/redirectors.inc.zst",
    "$LOCAL_CONFDIR/local.d/maps.d/redirectors.inc",
    "$LOCAL_CONFDIR/local.d/redirectors.inc",
    "fallback+file://${CONFDIR}/maps.d/redirectors.inc",
  ];

  # Disabled by default
  openphish_enabled = false;
  openphish_premium = false;
  openphish_map = "https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt";
  # The phishtank zone is empty these days but still draws most of the rbldns query load
  phishtank_enabled = false;

  # List of excluded hosts from checks over openphish, phishtank and generic_service
  phishing_feed_exclusion_symbol = "PHISHED_EXCLUDED";
  # Disabled by default
  phishing_feed_exclusion_enabled = false;
  phishing_feed_exclusion_map = "$LOCAL_CONFDIR/local.d/maps.d/phishing_feed_exclusion.inc";

  # Legacy scoring exclusions for explicitly configured domains. These do not
  # remove URL_DISPLAY_MISMATCH or exclude URLs from phishing-feed checks.
  exceptions = {
    PHISHED_WHITELISTED = [
      "glob;{= env.MAPS_MIRROR | default "https://maps.rspamd.com" =}/rspamd/phishing_whitelist.inc.zst",
      "glob;$LOCAL_CONFDIR/local.d/maps.d/phishing_whitelist.inc",
      "glob;$LOCAL_CONFDIR/local.d/phishing_whitelist.inc",
    ];
  };

  .include(try=true,priority=5) "${DBDIR}/dynamic/phishing.conf"
  .include(try=true,priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/phishing.conf"
  .include(try=true,priority=10) "$LOCAL_CONFDIR/override.d/phishing.conf"
}
