# Please don't modify this file as your changes might be overwritten with
# the next update.
#
# You can modify 'local.d/clickhouse.conf' to add and merge
# parameters defined inside this section
#
# You can modify 'override.d/clickhouse.conf' to strictly override all
# parameters defined inside this section
#
# See https://rspamd.com/doc/faq.html#what-are-the-locald-and-overrided-directories
# for details
#
# Module documentation can be found at  https://rspamd.com/doc/modules/clickhouse.html

clickhouse {
  # Push update when 1000 records are collected (1000 if unset)
  limit = 1000;
  # IP:port of Clickhouse server
  # server = "localhost:8123";
  # Timeout to wait for response (5 seconds if unset)
  timeout = 5;
  # How many bits of sending IP to mask in logs for IPv4 (19 if unset)
  ipmask = 19;
  # How many bits of sending IP to mask in logs for IPv6 (48 if unset)
  ipmask6 = 48;
  # Record URL paths? (default false)
  full_urls = false;
  # This parameter points to a map of domain names
  # If a message has a domain in this map in From: header and DKIM signature,
  # record general metadata in a table named after the domain
  #from_tables = "/etc/rspamd/clickhouse_from.map";
  # These are symbols of other checks in Rspamd
  # Set these if you use non-default symbol names (unlikely)
  #bayes_spam_symbols = ["BAYES_SPAM"];
  #bayes_ham_symbols = ["BAYES_HAM"];
  #fann_symbols = ["FANN_SCORE"];
  #fuzzy_symbols = ["FUZZY_DENIED"];
  #whitelist_symbols = ["WHITELIST_DKIM", "WHITELIST_SPF_DKIM", "WHITELIST_DMARC"];
  #dkim_allow_symbols = ["R_DKIM_ALLOW"];
  #dkim_reject_symbols = ["R_DKIM_REJECT"];
  #dmarc_allow_symbols = ["DMARC_POLICY_ALLOW"];
  #dmarc_reject_symbols = ["DMARC_POLICY_REJECT", "DMARC_POLICY_QUARANTINE"];

  # Enable a named preset of extra_columns. Currently supported: "outbound"
  # (per-sender profiling columns for outbound traffic analysis: languages,
  # hour-of-day, envelope-from domain, recipient domains, etc.). User-supplied
  # extra_columns with matching names take precedence. Schema migration is
  # applied automatically via the existing extra_columns mechanism.
  # preset = "outbound";

  # Per-symbol run times of selected symbols, stored in the columns
  # ProfileReason, Profile.Names, Profile.Times, Profile.SyncTimes and
  # Profile.Flags. Off unless sample_rate or slow_time is set. What is timed is
  # selected with `groups` (every symbol of the group) and `symbols`. A virtual
  # symbol has no code of its own: selecting it selects the callback symbol
  # that executes it, so name the callbacks you care about (the time is
  # accounted to that callback, for example in Profile.Names).
  # Rspamd times the selected symbols precisely on every scan; the record is
  # kept at the end of the scan if it is chosen as a random sample or if a
  # selected symbol was slow.
  # The columns appear in the table only after the schema has been migrated to
  # version 13 (done by the primary controller on start). A scanner sends the
  # profile columns after it has seen all clickhouse servers at that version
  # and sends none before, so no rows are lost during an upgrade.
  #profile {
  #  # Probability to keep a scan (0.01 = every 100th scan on average, 0 = no
  #  # sampling). Only rows with ProfileReason = 'sampled' form a
  #  # representative sample of all scans.
  #  sample_rate = 0.01;
  #  # Also keep a scan if a selected symbol ran at least this long (seconds or
  #  # a time string such as "500ms"; 0 = off). These rows have
  #  # ProfileReason = 'slow' and are biased towards slow scans.
  #  slow_time = 0.5;
  #  # At most this many 'slow' records per second per worker (0 = no limit)
  #  max_slow_rate = 1;
  #  groups = ["my_plugins"];
  #  symbols = ["MY_SYMBOL"];
  #}
  # Columns:
  #  - ProfileReason: 'none', 'sampled' (random sample) or 'slow' (a selected
  #    symbol ran at least slow_time)
  #  - Profile.Names: executed symbols (virtual symbols are accounted to the
  #    parent callback)
  #  - Profile.Times: wall-clock run time in milliseconds. The time of an
  #    asynchronous symbol includes waiting and the time of other rules running
  #    on the event loop meanwhile
  #  - Profile.SyncTimes: the synchronous part of the symbol call in
  #    milliseconds
  #  - Profile.Flags: bit mask: 1 asynchronous, 2 unfinished when the profile
  #    was taken, 4 finished by the task timeout. Entries with bit 2 or 4 set
  #    are lower bounds of the real time
  # Columns named ProfileReason or Profile.* cannot be used in extra_columns.

  #retention {
  #  # disabled by default
  #  enable = true;
  #  # drop | detach, please refer to ClickHouse docs for details
  #  # http://clickhouse-docs.readthedocs.io/en/latest/query_language/queries.html#manipulations-with-partitions-and-parts
  #  method = "drop";
  #  # how many month the data should be kept in ClickHouse
  #  period_months = 3;
  #  # how often run the cleanup process
  #  run_every = "7d";
  #}

  .include(try=true,priority=5) "${DBDIR}/dynamic/clickhouse.conf"
  .include(try=true,priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/clickhouse.conf"
  .include(try=true,priority=10) "$LOCAL_CONFDIR/override.d/clickhouse.conf"
}
