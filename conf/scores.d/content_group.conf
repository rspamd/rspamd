# Content matching rules
#
# Please don't modify this file as your changes might be overwritten with
# the next update.
#
# You can modify '$LOCAL_CONFDIR/rspamd.conf.local.override' to redefine
# parameters defined on the top level
#
# You can modify '$LOCAL_CONFDIR/rspamd.conf.local' to add
# parameters defined on the top level
#
# For specific modules or configuration you can also modify
# '$LOCAL_CONFDIR/local.d/content_group.conf' - to add your options or rewrite defaults
# '$LOCAL_CONFDIR/override.d/content_group.conf' - to override the defaults
#
# See https://rspamd.com/doc/developers/writing_rules.html for details

description = "Content rules";

symbols = {
  "PDF_ENCRYPTED" {
    weight = 0.3;
    description = "There is an encrypted PDF in the message";
    one_shot = true;
  }
  "PDF_JAVASCRIPT" {
    weight = 0.1;
    description = "There is an PDF with JavaScript in the message";
    one_shot = true;
  }
  "PDF_SUSPICIOUS" {
    weight = 4.5;
    description = "There is an PDF with suspicious properties in the message";
    one_shot = true;
  }
  "PDF_LONG_TRAILER" {
    weight = 0.2;
    description = "There is an PDF with a long trailer in the message";
    one_shot = true;
  }
  "PDF_MANY_OBJECTS" {
    weight = 0;
    description = "There is a PDF with too many objects in the message";
    one_shot = true;
  }
  "PDF_TIMEOUT" {
    weight = 0;
    description = "There is a PDF in the message that caused timeout in processing";
    one_shot = true;
  }
  "DOCX_CONTENT" {
    weight = 0;
    description = "There is a DOCX document in the message";
    one_shot = true;
  }
  "DOCX_EXTERNAL_LINKS" {
    weight = 0;
    description = "There is a DOCX document with external links in the message";
    one_shot = true;
  }
  "DOCX_SUSPICIOUS" {
    weight = 0;
    description = "There is a DOCX document that could not be fully processed";
    one_shot = true;
  }
  "SVG_CONTENT" {
    weight = 0;
    description = "There is an SVG image in the message";
    one_shot = true;
  }
  "SVG_SUSPICIOUS" {
    weight = 0;
    description = "There is an SVG image that could not be fully processed";
    one_shot = true;
  }
  "SVG_SCRIPT" {
    weight = 0.1;
    description = "There is an SVG image with scripts or event handlers";
    one_shot = true;
  }
  "SVG_FOREIGN_OBJECT" {
    weight = 0.1;
    description = "There is an SVG image embedding HTML content";
    one_shot = true;
  }
  "SVG_DATA_URI" {
    weight = 0.1;
    description = "There is an SVG image carrying non-image data: URIs";
    one_shot = true;
  }
  "SVG_EXTERNAL_LINKS" {
    weight = 0;
    description = "There is an SVG image with hyperlinks";
    one_shot = true;
  }
  "SVG_EXTERNAL_RESOURCES" {
    weight = 0;
    description = "There is an SVG image loading remote resources";
    one_shot = true;
  }
  "SVG_FORM" {
    weight = 0.1;
    description = "There is an SVG image with an HTML form or password input";
    one_shot = true;
  }
  "SVG_REDIRECT" {
    weight = 0.1;
    description = "There is an SVG image that redirects or embeds another document";
    one_shot = true;
  }
}
