# Enable in local.d/multistage.conf on the proxy and every scanner.
# See multistage.conf.example and conf/multistage.md in the source tree.
multistage {
  enabled = false;
  timeout = 2s;

  .include(try=true,priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/multistage.conf"
  .include(try=true,priority=10) "$LOCAL_CONFDIR/override.d/multistage.conf"
}
