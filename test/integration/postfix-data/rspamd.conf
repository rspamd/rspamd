options {
  filters = [];
  url_tld = "/source/test/lua/unit/test_tld.dat";
  pidfile = "/tmp/postfix-data/rspamd.pid";
  dns {
    nameserver = "127.0.0.1:15353";
    timeout = 0.1;
    retransmits = 1;
    fake_records = [
      { name = "pass.example.test"; type = "txt"; replies = ["v=spf1 ip4:127.0.0.0/8 -all"]; },
      { name = "fail.example.test"; type = "txt"; replies = ["v=spf1 -all"]; },
      { name = "soft.example.test"; type = "txt"; replies = ["v=spf1 ~all"]; },
      { name = "error.example.test"; type = "txt"; rcode = "servfail"; },
      { name = "1.0.0.127.rbl.example.test"; type = "a"; rcode = "norec"; },
      { name = "2.0.0.127.rbl.example.test"; type = "a"; replies = ["127.0.0.2"]; }
    ];
  }
}

logging { type = "file"; filename = "/tmp/postfix-data/rspamd.log"; level = "debug"; }
actions { reject = 100; }

multistage {
  key = "postfix-data-integration-test-key-01";
  timeout = 0.3;
  policies = [
    { name = "helo"; symbol = "INTEGRATION_HELO"; action = "reject"; reason = "Blocked HELO"; },
    { name = "spf"; symbol = "R_SPF_FAIL"; action = "reject"; reason = "SPF hard fail"; },
    { name = "rbl"; symbol = "INTEGRATION_RBL"; action = "reject"; reason = "Listed client IP"; },
    { name = "spf-temporary"; symbol = "R_SPF_DNSFAIL"; action = "soft reject"; reason = "SPF lookup failed"; }
  ];
  settings {
    exempt_recipient {
      match { rcpt = "exempt@localhost"; }
      apply { policies_disabled = ["helo", "spf", "rbl", "spf-temporary"]; }
    }
  }
}

multimap {
  INTEGRATION_HELO {
    type = "helo";
    regexp = true;
    map = { url = "static"; data = ["/^blocked[.]/i"]; };
    score = 4;
  }
}

# Loopback clients and deterministic DNS replies are confined to this fixture.
spf { check_local = true; spf_cache_size = 0; }
rbl {
  default_exclude_local = false;
  rbls {
    integration {
      symbol = "INTEGRATION_RBL_CHECK";
      rbl = "rbl.example.test";
      checks = ["from"];
      ignore_whitelist = true;
      disable_monitoring = true;
      returncodes { INTEGRATION_RBL = "127.0.0.2"; }
    }
  }
}

worker { type = "normal"; bind_socket = "127.0.0.1:11333"; count = 1; task_timeout = 5s; }
worker {
  type = "rspamd_proxy";
  bind_socket = "127.0.0.1:11332";
  bind_socket = "/var/spool/postfix/rspamd-self.sock mode=0660";
  count = 1;
  milter = true;
  timeout = 5s;
  upstream { local { self_scan = true; default = true; } }
}
worker {
  type = "rspamd_proxy";
  bind_socket = "127.0.0.1:11336";
  bind_socket = "/var/spool/postfix/rspamd-remote.sock mode=0660";
  count = 1;
  milter = true;
  timeout = 5s;
  allow_file_and_shm_inputs = false;
  upstream { scanner { hosts = "127.0.0.1:11333"; default = true; } }
}
worker {
  type = "rspamd_proxy";
  bind_socket = "127.0.0.1:11338";
  bind_socket = "/var/spool/postfix/rspamd-fallback.sock mode=0660";
  count = 1;
  milter = true;
  timeout = 5s;
  allow_file_and_shm_inputs = false;
  upstream { scanner { hosts = "127.0.0.1:18080"; default = true; } }
}

lua = "/opt/postfix-data/rules.lua";
