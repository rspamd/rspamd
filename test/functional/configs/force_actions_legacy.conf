.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"
lua = "{= env.TESTDIR =}/lua/force_actions_probe.lua";

# The legacy format: expressions per action, without rule names or priorities
force_actions {
	actions {
		reject = ["FA_LEGACY_COMPOSITE", "FA_LEGACY_TIE_REJECT"];
		"add header" = ["FA_LEGACY_PLAIN", "FA_LEGACY_TIE_ADD_HEADER"];
	}
}

composites {
	FA_LEGACY_COMPOSITE {
		expression = "FA_LEGACY_A & FA_LEGACY_B";
		score = 0.0;
	}
}

settings {
	id_legacy_composite {
		id = "id_legacy_composite";
		apply {
			symbols {
				FA_LEGACY_A = 0.0;
				FA_LEGACY_B = 0.0;
				FA_PROBE_ACTION = 0.0;
			}
		}
	}
	id_legacy_tie {
		id = "id_legacy_tie";
		apply {
			symbols {
				FA_LEGACY_TIE_REJECT = 0.0;
				FA_LEGACY_TIE_ADD_HEADER = 0.0;
			}
		}
	}
	id_legacy_plain {
		id = "id_legacy_plain";
		apply {
			symbols {
				FA_LEGACY_PLAIN = 0.0;
			}
		}
	}
}
