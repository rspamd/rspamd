.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"
lua = "{= env.TESTDIR =}/lua/force_actions_probe.lua";

actions {
	# A custom action: has_pre_result must report its name, not "custom"
	fa_hold = 1000000;
}

force_actions {
	rules {
    	FORCE_REJECT_TO_ADD_HEADER {
        	action = "add header";
        	expression = "UBER_REJECT";
        	require_action = ["reject"];
    	}
    	FORCE_REJECT_TO_NO_ACTION {
        	action = "no action";
        	expression = "UBER_REJECT2";
        	require_action = ["reject"];
		}
		FORCE_NO_ACTION_TO_REJECT {
        	action = "reject";
        	expression = "UBER_HAM";
        	require_action = ["no action"];
		}
		FORCE_NO_ACTION_TO_ADD_HEADER {
        	action = "add header";
        	expression = "UBER_HAM2";
        	require_action = ["no action"];
		}
    	FORCE_ADD_HEADER_TO_NO_ACTION {
        	action = "no action";
        	expression = "UBER_ADD_HEADER";
        	require_action = ["add header"];
		}
		FORCE_ADD_HEADER_TO_REJECT {
        	action = "reject";
        	expression = "UBER_ADD_HEADER2";
        	require_action = ["add header"];
		}
		# Expression uses a composite, which is only resolved after the filter
		# stage: the rule must be auto-registered as a postfilter.
		FORCE_COMPOSITE_TO_REJECT {
			action = "reject";
			expression = "FA_COMPOSITE";
		}
		# Two rules matching at once; the higher priority one must win. Here the
		# winner is also registered first (rules are registered name-sorted).
		FORCE_PRIO_A_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO1";
			priority = "high";
		}
		FORCE_PRIO_A_REJECT {
			action = "reject";
			expression = "FA_PRIO1";
			priority = "low";
		}
		# Same, but the winner is registered last, so only priority can decide.
		FORCE_PRIO_B_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO2";
			priority = "low";
		}
		FORCE_PRIO_B_REJECT {
			action = "reject";
			expression = "FA_PRIO2";
			priority = "high";
		}
		# Numeric priority form, both rules again on the main (filter) stage.
		FORCE_PRIO_C_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO3";
			priority = 0;
		}
		FORCE_PRIO_C_REJECT {
			action = "reject";
			expression = "FA_PRIO3";
			priority = 2;
		}
		# The score already selects `reject`, the critical reject must still outrank the later rule
		FORCE_PRIO_D_A_LOW_REJECT {
			action = "reject";
			expression = "FA_PRIO4";
			priority = "low";
			process_all = true;
		}
		FORCE_PRIO_D_B_CRITICAL_REJECT {
			action = "reject";
			expression = "FA_PRIO4";
			priority = "critical";
			process_all = true;
		}
		FORCE_PRIO_D_C_NORMAL_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO4";
			priority = "normal";
			process_all = true;
		}
		# A rule without priority is normal: it outranks a low one that runs first
		FORCE_PRIO_E_A_LOW_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO5";
			priority = "low";
		}
		FORCE_PRIO_E_B_DEFAULT_REJECT {
			action = "reject";
			expression = "FA_PRIO5";
		}
		# No process_all: the composite witness proves the scan was not cut short.
		# Critical, so that it is not outranked: only the already selected action
		# can imply process_all
		FORCE_PRIO_F_REJECT {
			action = "reject";
			expression = "FA_PRIO6";
			priority = "critical";
		}
		# Main-stage rule competing with a postfilter (composite) rule. A main stage
		# rule below another one gets process_all implied, otherwise its pre-result
		# would suppress the composite and the postfilter rule could not fire.
		FORCE_MIX_MAIN_WINS_ADD_HEADER {
			action = "add header";
			expression = "FA_MIX_A";
			priority = "high";
			process_all = true;
		}
		FORCE_MIX_MAIN_WINS_REJECT {
			action = "reject";
			expression = "FA_MIX_COMPOSITE";
			priority = "low";
		}
		FORCE_MIX_POST_WINS_ADD_HEADER {
			action = "add header";
			expression = "FA_MIX2_A";
			priority = "low";
		}
		FORCE_MIX_POST_WINS_REJECT {
			action = "reject";
			expression = "FA_MIX2_COMPOSITE";
			priority = "high";
		}
		FORCE_PRIO_RANGE_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO_RANGE";
			priority = -10;
		}
		FORCE_PRIO_RANGE_REJECT {
			action = "reject";
			expression = "FA_PRIO_RANGE";
			priority = 10;
		}
		FORCE_PRIO_INVALID_NAME {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = "invalid";
		}
		FORCE_PRIO_FRACTIONAL {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = 1.5;
		}
		FORCE_PRIO_NAN {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = nan;
		}
		FORCE_PRIO_LEAST {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = "critical";
			least = true;
		}
		FORCE_PRIO_INFINITE {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = inf;
		}
		FORCE_PRIO_NEG_INFINITE {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = -inf;
		}
		FORCE_PRIO_NEG_ZERO {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = -0.0;
		}
		# A least result for another action heads the list: its reply is not
		# carried over to the rule re-recording the score-selected action. The
		# composite makes the second rule a postfilter, so it runs after the first
		FORCE_CARRY_A_LEAST_ADD_HEADER {
			action = "add header";
			expression = "FA_CARRY";
			message = "Least add header";
			least = true;
		}
		FORCE_CARRY_B_LOW_REJECT {
			action = "reject";
			expression = "FA_CARRY_COMPOSITE";
			priority = "low";
		}
		# The top priority: nothing can outrank it, so it stops the scan
		FORCE_TOP_CRITICAL_REJECT {
			action = "reject";
			expression = "FA_TOP";
			priority = "critical";
		}
		# No priority: the rule still skips once its action is selected, even
		# though other rules set priorities
		FORCE_UNRELATED_NO_ACTION {
			action = "no action";
			expression = "FA_UNRELATED_WL";
		}
		# The low rule must not suppress the composite of the high one
		FORCE_STARVE_A_LOW_REJECT {
			action = "reject";
			expression = "FA_STARVE_A";
			priority = "low";
		}
		FORCE_STARVE_B_HIGH_NO_ACTION {
			action = "no action";
			expression = "FA_STARVE_COMPOSITE";
			priority = "high";
		}
		# The composite rule runs before the honor_action one, whatever the names
		FORCE_HONOR_A_ADD_HEADER {
			action = "add header";
			expression = "FA_HONOR_WL";
			honor_action = ["reject"];
		}
		FORCE_HONOR_B_COMPOSITE_REJECT {
			action = "reject";
			expression = "FA_HONOR_COMPOSITE";
		}
		# A least result cannot outrank a non-least one, whatever the priority
		FORCE_LEAST_A_CRITICAL_REJECT {
			action = "reject";
			expression = "FA_LEAST";
			priority = "critical";
			least = true;
		}
		FORCE_LEAST_B_LOW_NO_ACTION {
			action = "no action";
			expression = "FA_LEAST";
			priority = "low";
		}
		# A rule without priority leaves the score-selected action as it is, yet a
		# low rule matching later must not override it
		FORCE_KEEP_A_REJECT {
			action = "reject";
			expression = "FA_KEEP_A";
		}
		FORCE_KEEP_B_LOW_NO_ACTION {
			action = "no action";
			expression = "FA_KEEP_COMPOSITE";
			priority = "low";
		}
		# Nothing runs after the honor_action rules, so this one does not record
		# the selected action, whatever its priority
		FORCE_HONOR_PIN_NO_ACTION {
			action = "no action";
			expression = "FA_PIN";
			honor_action = ["reject"];
			priority = "high";
		}
		# A least rule without priority stays below the least results of the
		# other modules, here the probe set after it
		FORCE_LEAST_UNSET_ADD_HEADER {
			action = "add header";
			expression = "FA_LEAST_UNSET";
			least = true;
		}
		# The reply of a custom action is kept as well
		FORCE_CUSTOM_A_LOW_HOLD {
			action = "fa_hold";
			expression = "FA_CUSTOM";
			message = "Held by the low rule";
			priority = "low";
		}
		FORCE_CUSTOM_B_HIGH_HOLD {
			action = "fa_hold";
			expression = "FA_CUSTOM_COMPOSITE";
			priority = "high";
		}
		# The reply of the probe is not for the SMTP client, nor is it once this
		# rule takes its place
		FORCE_NOTE_HIGH_REJECT {
			action = "reject";
			expression = "FA_NOTE_COMPOSITE";
			priority = "high";
		}
		# The high rule takes the place of the low one and keeps its reply. The
		# reply is kept from a result recorded before, so the composite makes the
		# high rule run after the low one
		FORCE_REPLY_A_LOW_REJECT {
			action = "reject";
			expression = "FA_REPLY";
			message = "Rejected by the low rule";
			priority = "low";
		}
		FORCE_REPLY_B_HIGH_REJECT {
			action = "reject";
			expression = "FA_REPLY_COMPOSITE";
			priority = "high";
		}
		# The reply is the one of the result that selects the action, not of the
		# least result heading the list
		FORCE_SEL_A_LOW_REJECT {
			action = "reject";
			expression = "FA_SEL";
			message = "Rejected by the selected rule";
			priority = "low";
		}
		FORCE_SEL_B_HIGH_REJECT {
			action = "reject";
			expression = "FA_SEL_COMPOSITE";
			priority = "high";
		}
		# The require/honor_action rules run by priority, whatever the names
		FORCE_LATE_A_ADD_HEADER {
			action = "add header";
			expression = "FA_LATE";
			require_action = ["reject"];
		}
		FORCE_LATE_Z_HIGH_REJECT {
			action = "reject";
			expression = "FA_LATE";
			require_action = ["reject"];
			priority = "high";
		}
		# Equal priorities: the rule without priority keeps the selected action,
		# and the later rule of the same rank still wins, as on master
		FORCE_TIE_A_REJECT {
			action = "reject";
			expression = "FA_TIE_A";
		}
		FORCE_TIE_B_NO_ACTION {
			action = "no action";
			expression = "FA_TIE_COMPOSITE";
		}
		# The kept action is the one of the lower rule: its reply stays
		FORCE_KEEP_MSG_A_REJECT {
			action = "reject";
			expression = "FA_KEEP_MSG_A";
		}
		FORCE_KEEP_MSG_B_LOW_REJECT {
			action = "reject";
			expression = "FA_KEEP_MSG_COMPOSITE";
			message = "Rejected by the low keeper";
			priority = "low";
		}
		# The kept action recorded on the main stage does not stop the scan
		FORCE_KEEP_SCAN_A_REJECT {
			action = "reject";
			expression = "FA_KEEP_SCAN_A";
		}
		FORCE_KEEP_SCAN_B_LOW_NO_ACTION {
			action = "no action";
			expression = "FA_KEEP_SCAN_B";
			priority = "low";
		}
		# A rule with a reply records the selected action anyway, for the reply
		FORCE_MSG_SAME_REJECT {
			action = "reject";
			expression = "FA_MSG_SAME";
			message = "Rejected with a reason";
		}
		# A least result raises the action kept by a rule without priority, as
		# before, whatever its priority
		FORCE_LEAST_OVER_A_ADD_HEADER {
			action = "add header";
			expression = "FA_LEAST_OVER_A";
		}
		FORCE_LEAST_OVER_B_CRITICAL_REJECT {
			action = "reject";
			expression = "FA_LEAST_OVER_COMPOSITE";
			priority = "critical";
			least = true;
		}
		# A least rule does not keep: the later least rule is not outranked by it
		FORCE_LEAST_KEEP_A_NO_ACTION {
			action = "no action";
			expression = "FA_LEAST_KEEP_A";
			least = true;
		}
		FORCE_LEAST_KEEP_B_LOW_ADD_HEADER {
			action = "add header";
			expression = "FA_LEAST_KEEP_COMPOSITE";
			priority = "low";
			least = true;
		}
		# A least rule only raises the kept action, also when its priority is
		# below the one of the keeping rule
		FORCE_LEAST_LOW_A_NO_ACTION {
			action = "no action";
			expression = "FA_LEAST_LOW_A";
		}
		FORCE_LEAST_LOW_B_ADD_HEADER {
			action = "add header";
			expression = "FA_LEAST_LOW_COMPOSITE";
			priority = "low";
			least = true;
		}
		# The high rule keeps no action, then the least rule raises it to add
		# header: the normal rule keeping add header replaces the stale marker,
		# so the low rule does not override it
		FORCE_STALE_LATE_A_HIGH_NO_ACTION {
			action = "no action";
			expression = "FA_STALE_LATE";
			require_action = ["no action"];
			priority = "high";
		}
		FORCE_STALE_LATE_B_HIGH_LEAST_ADD_HEADER {
			action = "add header";
			expression = "FA_STALE_LATE";
			require_action = ["no action"];
			priority = "high";
			least = true;
		}
		FORCE_STALE_LATE_C_ADD_HEADER {
			action = "add header";
			expression = "FA_STALE_LATE";
			require_action = ["add header"];
		}
		FORCE_STALE_LATE_D_LOW_REJECT {
			action = "reject";
			expression = "FA_STALE_LATE";
			require_action = ["add header"];
			priority = "low";
		}
		# Of the rules keeping the action at the same rank, the last one is
		# recorded
		FORCE_EQ_LATE_A_REJECT {
			action = "reject";
			expression = "FA_EQ_LATE";
			require_action = ["reject"];
		}
		FORCE_EQ_LATE_B_NORMAL_REJECT {
			action = "reject";
			expression = "FA_EQ_LATE";
			require_action = ["reject"];
			priority = "normal";
		}
		FORCE_EQ_LATE_C_LOW_ADD_HEADER {
			action = "add header";
			expression = "FA_EQ_LATE";
			require_action = ["reject"];
			priority = "low";
		}
		# A require_action rule without priority (normal) runs before a low one
		FORCE_LATE2_A_LOW_ADD_HEADER {
			action = "add header";
			expression = "FA_LATE2";
			require_action = ["reject"];
			priority = "low";
		}
		FORCE_LATE2_B_NO_ACTION {
			action = "no action";
			expression = "FA_LATE2";
			require_action = ["reject"];
		}
		# Composite rules run in the name order: the high rule keeps the reply
		# of the low one
		FORCE_COMP_REPLY_A_LOW_REJECT {
			action = "reject";
			expression = "FA_COMP_REPLY_COMPOSITE";
			message = "Rejected by the low composite rule";
			priority = "low";
		}
		FORCE_COMP_REPLY_B_HIGH_REJECT {
			action = "reject";
			expression = "FA_COMP_REPLY_COMPOSITE";
			priority = "high";
		}
	}
}

