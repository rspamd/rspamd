.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"

force_actions {
	rules {
    	FORCE_REJECT_TO_ADD_HEADER {
        	action = "add header";
        	expression = "UBER_REJECT";
        	require_action = ["reject"];
    	}
    	FORCE_REJECT_TO_NO_ACTION {
        	action = "no action";
        	expression = "UBER_REJECT2";
        	require_action = ["reject"];
		}
		FORCE_NO_ACTION_TO_REJECT {
        	action = "reject";
        	expression = "UBER_HAM";
        	require_action = ["no action"];
		}
		FORCE_NO_ACTION_TO_ADD_HEADER {
        	action = "add header";
        	expression = "UBER_HAM2";
        	require_action = ["no action"];
		}
    	FORCE_ADD_HEADER_TO_NO_ACTION {
        	action = "no action";
        	expression = "UBER_ADD_HEADER";
        	require_action = ["add header"];
		}
		FORCE_ADD_HEADER_TO_REJECT {
        	action = "reject";
        	expression = "UBER_ADD_HEADER2";
        	require_action = ["add header"];
		}
		# Expression uses a composite, which is only resolved after the filter
		# stage: the rule must be auto-registered as a postfilter.
		FORCE_COMPOSITE_TO_REJECT {
			action = "reject";
			expression = "FA_COMPOSITE";
		}
		# Two rules matching at once; the higher priority one must win. Here the
		# winner is also registered first (rules are registered name-sorted).
		FORCE_PRIO_A_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO1";
			priority = "high";
		}
		FORCE_PRIO_A_REJECT {
			action = "reject";
			expression = "FA_PRIO1";
			priority = "low";
		}
		# Same, but the winner is registered last, so only priority can decide.
		FORCE_PRIO_B_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO2";
			priority = "low";
		}
		FORCE_PRIO_B_REJECT {
			action = "reject";
			expression = "FA_PRIO2";
			priority = "high";
		}
		# Numeric priority form, both rules again on the main (filter) stage.
		FORCE_PRIO_C_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO3";
			priority = 0;
		}
		FORCE_PRIO_C_REJECT {
			action = "reject";
			expression = "FA_PRIO3";
			priority = 2;
		}
		# Main-stage rule competing with a postfilter (composite) rule.
		# process_all is required on the main-stage rule: without it the pre-result
		# disables the whole cache, the composite is never evaluated and the
		# postfilter rule could not fire at all.
		FORCE_MIX_MAIN_WINS_ADD_HEADER {
			action = "add header";
			expression = "FA_MIX_A";
			priority = "high";
			process_all = true;
		}
		FORCE_MIX_MAIN_WINS_REJECT {
			action = "reject";
			expression = "FA_MIX_COMPOSITE";
			priority = "low";
		}
		FORCE_MIX_POST_WINS_ADD_HEADER {
			action = "add header";
			expression = "FA_MIX2_A";
			priority = "low";
			process_all = true;
		}
		FORCE_MIX_POST_WINS_REJECT {
			action = "reject";
			expression = "FA_MIX2_COMPOSITE";
			priority = "high";
		}
		FORCE_PRIO_RANGE_ADD_HEADER {
			action = "add header";
			expression = "FA_PRIO_RANGE";
			priority = -10;
		}
		FORCE_PRIO_RANGE_REJECT {
			action = "reject";
			expression = "FA_PRIO_RANGE";
			priority = 10;
		}
		FORCE_PRIO_INVALID_NAME {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = "invalid";
		}
		FORCE_PRIO_FRACTIONAL {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = 1.5;
		}
		FORCE_PRIO_NAN {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = "nan";
		}
		FORCE_PRIO_LEAST {
			action = "no action";
			expression = "FA_PRIO_RANGE";
			priority = "critical";
			least = true;
		}
	}
}

composites {
	FA_COMPOSITE {
		expression = "FA_COMP_A & FA_COMP_B";
		score = 0.0;
	}
	FA_MIX_COMPOSITE {
		expression = "FA_MIX_A & FA_MIX_B";
		score = 0.0;
	}
	FA_MIX2_COMPOSITE {
		expression = "FA_MIX2_A & FA_MIX2_B";
		score = 0.0;
	}
}


