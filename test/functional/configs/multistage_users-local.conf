multistage {
  policies = [
    { name = "asn-block"; symbol = "USER_ASN"; action = "reject"; reason = "blocked ASN"; },
    { name = "helo-block"; symbol = "USER_HELO"; action = "reject"; reason = "blocked HELO";
      except { rcpt = "helo-exempt@protected.test"; } }
  ];
  settings {
    defaults { priority = -1; apply { policies_enabled = []; } }
    protected { match { rcpt = "@protected.test"; }
      apply { policies_enabled = ["asn-block", "helo-block"]; } }
    recipient_exemption { priority = 1; match { rcpt = "exempt@protected.test"; }
      apply { policies_disabled = ["asn-block", "helo-block"]; } }
    user_exemption { priority = 2; match { user = "trusted"; authenticated = true; }
      apply { policies_disabled = ["asn-block", "helo-block"]; } }
  }
}

asn { provider_info { ip4 = "asn.test"; ip6 = "asn6.test"; } }
multimap {
  USER_ASN { type = "asn"; map = ["64501"]; score = 5; }
  USER_COUNTRY { type = "country"; map = ["GB"]; score = 1; }
  USER_ASN_SELECTOR { type = "selector"; selector = "asn"; map = ["64501"]; score = 1; }
  USER_HELO { type = "helo"; regexp = true; map = { url = "static"; data = ["/^bad[.]/"]; }; score = 4; }
  USER_SMTP { type = "from"; extract_from = "smtp"; map = ["sender@example.com"]; score = 1; }
  USER_MIME { type = "from"; extract_from = "mime"; map = ["sender@example.com"]; score = 1; }
  USER_HEADER { type = "selector"; selector = "header(Subject)"; map = ["test"]; score = 1; }
  USER_ACTION { type = "helo"; map = ["action.example.com"]; action = "soft reject"; }
}

settings {
  late_exemption {
    header { X-EOM-Exempt = true; }
    apply { symbols_disabled = ["USER_ASN", "USER_HELO"]; }
  }
}

external_relay {
  enabled = {= env.DATA_RELAY_PLUGIN == 'enabled' =};
  rules {
    source_ip { symbol = "USER_RELAY"; strategy = "ip_map"; ip_map = ["192.0.2.10"]; }
  }
}

options {
  dns {
    fake_records = [
      { name = "1.2.0.192.asn.test"; type = "txt"; replies = ["64501 | 192.0.2.0/24 | GB | test |"]; },
      { name = "2.2.0.192.asn.test"; type = "txt"; replies = ["64502 | 192.0.2.0/24 | US | test |"]; },
      { name = "3.2.0.192.asn.test"; type = "txt"; rcode = "norec"; },
      { name = "4.2.0.192.asn.test"; type = "txt"; rcode = "servfail"; },
      { name = "10.2.0.192.asn.test"; type = "txt"; replies = ["64501 | 192.0.2.0/24 | GB | test |"]; },
      { name = "{= '1.' .. string.rep('0.', 23) .. '8.b.d.0.1.0.0.2.asn6.test' =}";
        type = "txt"; replies = ["64501 | 2001:db8::/32 | GB | test |"]; }
    ];
  }
}
