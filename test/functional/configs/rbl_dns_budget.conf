.include(duplicate=merge,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"
.include(duplicate=merge,priority=1) "{= env.TESTDIR =}/configs/rbl_dns_budget-dns.conf"

rbl {
  rbls {
    # Native checks with every kind of source; the limit varies per rule
    RB_L1 {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo", "urls", "emails", "replyto"];
      emails_domainonly = true;
      max_dns_requests = 1;
    }
    RB_L3 {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo", "urls", "emails", "replyto"];
      emails_domainonly = true;
      max_dns_requests = 3;
    }
    RB_L5 {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo", "urls", "emails", "replyto"];
      emails_domainonly = true;
      max_dns_requests = 5;
    }
    # The limit is larger than the number of requests: no truncation
    RB_L100 {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo", "urls", "emails", "replyto"];
      emails_domainonly = true;
      max_dns_requests = 100;
    }
    # No max_dns_requests: nothing changes
    RB_NOLIMIT {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo", "urls", "emails", "replyto"];
      emails_domainonly = true;
    }

    # Selector only
    RB_SEL1 {
      rbl = "budget.test";
      disable_monitoring = true;
      selector = {
        sel_c = "id('sel-c-budget.com')";
        sel_a = "id('sel-a-budget.com')";
        sel_b = "id('sel-b-budget.com')";
      }
      max_dns_requests = 1;
    }
    RB_SEL2 {
      rbl = "budget.test";
      disable_monitoring = true;
      selector = {
        sel_c = "id('sel-c-budget.com')";
        sel_a = "id('sel-a-budget.com')";
        sel_b = "id('sel-b-budget.com')";
      }
      max_dns_requests = 2;
    }
    # Native check plus selectors
    RB_MIXED2 {
      rbl = "budget.test";
      disable_monitoring = true;
      from = true;
      selector = {
        sel_a = "id('sel-a-budget.com')";
        sel_b = "id('sel-b-budget.com')";
      }
      max_dns_requests = 2;
    }

    # Two selectors produce the same name: they share one slot
    RB_DUP2 {
      rbl = "budget.test";
      disable_monitoring = true;
      helo = true;
      selector = {
        dup_one = "id('dup-budget.com')";
        dup_two = "id('dup-budget.com')";
        sel_a = "id('sel-a-budget.com')";
      }
      max_dns_requests = 2;
    }

    RB_DUP_NATIVE {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["helo", "rdns"];
      max_dns_requests = 1;
    }
    RB_RAWMIX {
      rbl = "raw.test";
      disable_monitoring = true;
      hash = "sha256";
      hash_len = 32;
      helo = true;
      selector = "id('dup-budget.com')";
      selector_hash = false;
      # Different answers per name: a wrong merge changes the symbols
      returncodes = {
        RAWMIX_HASHED = "127.0.0.2";
        RAWMIX_PLAIN = "127.0.0.3";
      }
    }
    # The final query of the selector name equals the direct query of `from`
    RB_MERGE_CAP {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      from = true;
      selector = "id('same-budget.com')";
      max_dns_requests = 10;
    }
    RB_MERGE_UNCAP {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      from = true;
      selector = "id('same-budget.com')";
    }
    RB_MERGE_PFX {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      from = true;
      selector = "id('same-budget.com')";
      max_dns_requests = 10;
      returncodes = {
        CODE_2 = "127.0.0.2";
      }
      symbols_prefixes = {
        from = "MFA";
        selector = "MFB";
      }
    }
    # from takes one slot; the A lookup would take the last one, so no lookup
    RB_RESMIX2 {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      from = true;
      helo = true;
      max_dns_requests = 2;
    }
    RB_RBASE32_LEN {
      rbl = "rb32.test";
      disable_monitoring = true;
      hash = "sha256";
      hash_format = "rbase32";
      hash_len = 32;
      selector = "id('example.com')";
    }

    # helo, rdns and from are all forced requests
    RB_FORCED1 {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["helo", "rdns", "from"];
      max_dns_requests = 1;
    }

    # resolve_ip: origin lookups (A + AAAA) and final queries share the cap
    RB_RES_NOLIMIT {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      selector = "id('multi-budget.com')";
    }
    RB_RES1 {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      selector = "id('multi-budget.com')";
      max_dns_requests = 1;
    }
    RB_RES2 {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      selector = "id('multi-budget.com')";
      max_dns_requests = 2;
    }
    RB_RES4 {
      rbl = "budget.test";
      disable_monitoring = true;
      resolve_ip = true;
      selector = "id('multi-budget.com')";
      max_dns_requests = 4;
    }

    # The limit symbol is named after the rule symbol, not the callback
    RB_PFX {
      rbl = "budget.test";
      disable_monitoring = true;
      checks = ["from", "rdns", "helo"];
      returncodes = {
        CODE_2 = "127.0.0.2";
      }
      symbols_prefixes = {
        from = "PFXA";
        rdns = "PFXB";
        helo = "PFXC";
      }
      max_dns_requests = 1;
    }

    # hash_format = rbase32
    RB_RBASE32 {
      rbl = "rb32.test";
      disable_monitoring = true;
      hash = "sha256";
      hash_format = "rbase32";
      selector = "id('example.com')";
    }
    # The selector already returns an encoded hash
    RB_RAWSEL {
      rbl = "raw.test";
      disable_monitoring = true;
      hash = "sha256";
      selector = "id('0123456789abcdef')";
      selector_hash = false;
    }
    # Same selector, default behaviour: hashed again, so no such record
    RB_HASHEDSEL {
      rbl = "raw.test";
      disable_monitoring = true;
      hash = "sha256";
      selector = "id('0123456789abcdef')";
    }
  }
}
