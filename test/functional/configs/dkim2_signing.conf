.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"
.include(duplicate=merge,priority=1) "{= env.TESTDIR =}/configs/dkim2-dns.conf"

options = {
  filters = ["dkim"]
  pidfile = "{= env.TMPDIR =}/rspamd.pid"
  dns {
    retransmits = 2;
  }
}
logging = {
  type = "file",
  level = "debug"
  filename = "{= env.TMPDIR =}/rspamd.log"
}
metric = {
  name = "default",
  actions = {
    reject = 100500,
  }
  unknown_weight = 1
}

worker {
  type = normal
  bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
  count = 1
  keypair {
    pubkey = "{= env.KEY_PUB1 =}";
    privkey = "{= env.KEY_PVT1 =}";
  }
  task_timeout = 60s;
}

worker {
        type = controller
        bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
        count = 1
        secure_ip = ["127.0.0.1", "::1"];
        stats_path = "{= env.TMPDIR =}/stats.ucl"
}

dkim {
  enable_dkim2 = true;
}

dkim_signing {
  path = "{= env.TESTDIR =}/configs/dkim.key";
  selector = "rsa";
  sign_dkim2 = true;
  use_milter_headers = true;
}
