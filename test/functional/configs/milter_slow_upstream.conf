# Regression config for the asynchronous proxy milter error path.
#
# The only upstream is the normal worker, which is kept busy by slow_scan.lua
# for longer than the upstream timeout. Every master request therefore fails
# from proxy_backend_master_error_handler(). With token bucket rotation the
# retry excludes the failed upstream, finds nothing else, and the message has
# to be completed with TEMPFAIL from the backend callback, while the milter
# connection stays open for the next transaction. See
# test/functional/lua/miltertest/slow_upstream.lua.

options = {
	filters = ["spf", "dkim", "regexp"]
	url_tld = "{= env.URL_TLD =}"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua";
	gtube_patterns = "all";
	dns {
		retransmits = 2;
	}
}
logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
}
metric = {
	name = "default",
	actions = {
		reject = 100500,
	}
	unknown_weight = 1
}
worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	count = 1
	task_timeout = 60s;
}
worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}
worker {
	type = "rspamd_proxy";
	count = 1;
	timeout = 120;
	max_retries = 5;
	upstream {
		local {
			hosts = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}";
			default = true;
			# Much shorter than the delay added by slow_scan.lua
			timeout = 0.5;
			token_bucket {
				max_tokens = 10000;
				scale = 1024;
				min_tokens = 1;
				base_cost = 10;
			}
		}
	}
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_PROXY =}";
	milter = true;
}
modules {
    path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}
lua = "{= env.TESTDIR =}/lua/test_coverage.lua";
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua"
lua = "{= env.TESTDIR =}/lua/params.lua"
lua = "{= env.TESTDIR =}/lua/slow_scan.lua"
