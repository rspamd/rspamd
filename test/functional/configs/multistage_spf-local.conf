spf {
  # Disable the LRU so duplicate resolution cannot hide behind a cached result.
  spf_cache_size = {= env.SPF_CACHE_SIZE | default("0") =};
  check_local = false;
  check_authed = false;
  whitelist = ["192.0.2.10"];
{% if env.SPF_EXTERNAL_RELAY == '1' %}
  external_relay = ["192.0.2.10"];
{% endif %}
}
dkim { check_local = true; check_authed = true; }
dmarc { check_local = true; check_authed = true; }

external_relay {
  enabled = {= env.SPF_RELAY_PLUGIN == 'enabled' or env.SPF_RELAY_PLUGIN == 'empty' =};
{% if env.SPF_RELAY_PLUGIN ~= 'empty' %}
  rules {
    source_ip {
      symbol = "SPF_TEST_RELAY";
      strategy = "ip_map";
      ip_map = ["192.0.2.2", "192.0.2.10"];
    }
  }
{% endif %}
}

options {
  dns {
{% if env.SPF_CACHE_SIZE ~= '0' %}
    nameserver = "{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_UDP =}";
{% endif %}
    fake_records = [
      { name = "pass.example.com"; type = "txt"; replies = ["v=spf1 ip4:192.0.2.1 ip6:2001:db8::1 -all"]; },
      { name = "fail.example.com"; type = "txt"; replies = ["v=spf1 -all"]; },
      { name = "soft.example.com"; type = "txt"; replies = ["v=spf1 ~all"]; },
      { name = "neutral.example.com"; type = "txt"; replies = ["v=spf1 ?all"]; },
      { name = "plus.example.com"; type = "txt"; replies = ["v=spf1 +all"]; },
      { name = "none.example.com"; type = "txt"; rcode = "norec"; },
      { name = "temp.example.com"; type = "txt"; rcode = "servfail"; },
      { name = "perm.example.com"; type = "txt"; replies = ["v=spf1 invalid"]; },
      { name = "_dmarc.pass.example.com"; type = "txt"; replies = ["v=DMARC1; p=reject; aspf=s"]; },
      { name = "_dmarc.cached.example.com"; type = "txt"; replies = ["v=DMARC1; p=reject; aspf=s"]; },
      { name = "_dmarc.fail.example.com"; type = "txt"; replies = ["v=DMARC1; p=reject; aspf=s"]; },
      { name = "_dmarc.soft.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.neutral.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.plus.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.none.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.temp.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.perm.example.com"; type = "txt"; rcode = "norec"; },
      { name = "_dmarc.example.com"; type = "txt"; rcode = "norec"; }
    ];
  }
}
