.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"

lua = "{= env.LUA_SCRIPT =}";

settings {
  # Named setting with symbols_enabled for coexistence test
  merge_profile {
    id = "merge_profile";
    apply {
      symbols_enabled = ["MERGE_TEST_BASIC", "MERGE_HARD_DEP", "MERGE_WEAK_DEP"];
    }
  }

  # Named setting with group controls
  merge_group_ctl {
    id = "merge_group_ctl";
    apply {
      symbols_enabled = ["MERGE_GROUP_SYM", "MERGE_GROUP_SYM2", "MERGE_TEST_BASIC"];
    }
  }

  # Two layers: this rule (RULE) + the redis handler above (PER_USER)
  two_layer_rule {
    ip = "8.8.8.8";
    apply {
      actions {
        greylist = null;
      }
      tenant = "acme";
      shared = "from_rule";
    }
  }

  # Two layers where the rule declares a brand new custom action
  custom_action_rule {
    ip = "8.8.8.10";
    apply {
      actions {
        my_custom_action = 3.0;
      }
      tenant = "custom";
    }
  }

  # Single layer control: same disable, no redis layer for this IP
  one_layer_rule {
    ip = "8.8.8.9";
    apply {
      actions {
        greylist = null;
      }
      tenant = "solo";
    }
  }

  # Rule that matches by IP and provides action override
  ip_rule {
    ip = "7.7.7.7";
    apply {
      actions {
        reject = 100.0;
        greylist = 50.0;
      }
    }
  }
}

# Two-layer merge fixture: a static rule (RULE layer) plus a per-user layer
# pushed by the redis settings handler (PER_USER layer). Both carry custom
# (non-builtin) apply keys, and the rule disables the greylist action.
actions {
  greylist = 2.0;
}

settings_redis {
  servers = "{= env.REDIS_ADDR =}:{= env.REDIS_PORT =}";
  handlers = {
    merge_user = <<EOD
return function(task)
  local ip = task:get_from_ip()
  if ip and ip:is_valid() then
    local s = ip:to_string()
    if s == '8.8.8.8' or s == '8.8.8.10' then
      return 'merge_user_settings'
    end
  end
  return nil
end
EOD;
  }
}
