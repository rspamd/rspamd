.include "{= env.TESTDIR =}/configs/multistage.conf"

lua = "{= env.TESTDIR =}/lua/multistage_exporters.lua";
redis { servers = "{= env.REDIS_ADDR =}:{= env.REDIS_PORT =}"; }
history_redis { key_prefix = "test:terminal:history"; compress = false; nrows = 100; }
metadata_exporter {
  rules {
    JSON {
      backend = "redis_list";
      formatter = "json";
      list_key = "test:terminal:json";
    }
    STRUCTURED {
      backend = "redis_list";
      formatter = "structured";
      list_key = "test:terminal:structured";
    }
    RAW {
      backend = "redis_list";
      list_key = "test:terminal:raw";
    }
    CUSTOM {
      backend = "redis_list";
      formatter = "json";
      selector = "content";
      list_key = "test:terminal:custom";
    }
    FAILURE {
      backend = "http";
      formatter = "json";
      selector = "is_reject";
      url = "http://{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_HTTP =}/failure";
      defer = true;
    }
  }
  custom_select {
    content = "return function(task) assert(task:get_content():len() > 0); return true end";
  }
}
clickhouse {
  servers = "{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_HTTP =}";
  allow_local = true;
  use_gzip = false;
  enable_symbols = true;
  insert_subject = true;
  enable_digest = true;
  check_timeout = 0.05;
  limits { max_rows = 1; max_interval = 0.05; }
  extra_columns = [
    { name = "BodyHeader"; type = "String"; selector = "header(Subject)"; default_value = "unavailable"; },
    { name = "ClientHelo"; type = "String"; selector = "helo"; }
  ];
}
