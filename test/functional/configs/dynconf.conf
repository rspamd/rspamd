options = {
	filters = ["chartable", "fuzzy_check"]
	url_tld = "{= env.TESTDIR =}/../lua/unit/test_tld.dat"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua"
	dns {
		retransmits = 2;
	}
}

modules {
	path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}

# Registers the controller plugins, among them /plugins/dynconf/*
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua";

lang_detection {
	languages = "{= env.INSTALLROOT =}/share/rspamd/languages";
	prefer_fasttext = false;
}

logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
	log_usec = true;
}

metric = {
	name = "default",
	actions = {
		reject = 100500,
	}
	unknown_weight = 1
}

worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	count = 1
	keypair {
		pubkey = "{= env.KEY_PUB1 =}";
		privkey = "{= env.KEY_PVT1 =}";
	}
	task_timeout = 10s;
}

worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}

redis {
	servers = "{= env.REDIS_ADDR =}:{= env.REDIS_PORT =}";
}

# The framework under test: Redis backend probed every second
dynconf {
	enabled = true;
	backend = "redis";
	policy = "interval";
	interval = 1s;
	jitter = 0.1;
	key = "rspamd_dynconf_test";
}

# A C module: threshold is dynamic
chartable {
	symbol = "R_MIXED_CHARSET";
}

# A Lua module: enable_plus_aliases and enable_gmail_rules are dynamic
aliases {
	enabled = true;
	local_domains = ["example.com"];
	enable_gmail_rules = true;
	enable_plus_aliases = true;
}

# A C module with per-flag limits: rule.*.fuzzy_map.*.hits_limit is dynamic (no storage is contacted)
fuzzy_check {
	rule "dyn" {
		algorithm = "mumhash";
		servers = "127.0.0.1:1";
		symbol = "FUZZY_DYN_UNKNOWN";
		read_only = true;
		hits_limit = 2;
		fuzzy_map = {
			FUZZY_DYN_FLAG {
				max_score = 5.0;
				flag = 11;
			}
		}
	}
}

# A Lua module that publishes a schema as plugins.history_redis
history_redis {
	nrows = 100;
}
