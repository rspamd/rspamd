.include "{= env.TESTDIR =}/configs/multistage.conf"

options {
  dns {
    nameserver = "{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_UDP =}";
  }
}

rbl {
  default_exclude_local = false;
  rbls {
{% if env.RBL_SELECTOR_WHITE == 'enabled' %}
    selector_white {
      symbol = "RBL_SELECTOR_WHITE";
      rbl = "selector-white.rbl.test";
      selector { from = "header(X-RBL-White)"; }
      is_whitelist = true;
      disable_monitoring = true;
      returncodes { RBL_SELECTOR_WHITE_HIT = "127.0.0.2"; }
    }
{% endif %}
    mixed {
      symbol = "RBL_MIXED";
      rbl = "mixed.rbl.test";
      checks = ["from", "helo", "received", "urls"];
      url_full_hostname = true;
      disable_monitoring = true;
      returncodes { RBL_MIXED_HIT = "127.0.0.2"; }
    }
    white {
      symbol = "RBL_WHITE";
      rbl = "white.rbl.test";
      checks = ["from", "helo", "received", "urls"];
      url_full_hostname = true;
      is_whitelist = true;
      disable_monitoring = true;
      returncodes { RBL_WHITE_HIT = "127.0.0.2"; }
    }
    scripted {
      symbol = "RBL_SCRIPTED";
      rbl = "scripted.rbl.test";
      checks = ["from", "urls"];
      ignore_whitelist = true;
      disable_monitoring = true;
      process_script = "return function(value, zone, task) assert(task:get_header('From')); return value .. '.' .. zone end";
    }
    negative {
      symbol = "RBL_NEGATIVE";
      rbl = "miss.rbl.test";
      checks = ["helo", "urls"];
      url_full_hostname = true;
      ignore_whitelist = true;
      disable_monitoring = true;
    }
    mapped {
      symbol = "RBL_MAPPED";
      rbl = "mapped.rbl.test";
      checks = ["helo", "urls"];
      url_full_hostname = true;
      ignore_whitelist = true;
      disable_monitoring = true;
      returncodes_matcher = "glob";
      returncodes { RBL_MAPPED_HIT = "127.0.0.*"; }
    }
    selected {
      symbol = "RBL_SELECTED";
      rbl = "selected.rbl.test";
      from = true;
      selector = "header(Subject)";
      ignore_whitelist = true;
      disable_monitoring = true;
    }
    required {
      symbol = "RBL_REQUIRED";
      rbl = "required.rbl.test";
      checks = ["from", "urls"];
      require_symbols = ["RBL_TEST_REQUIRED"];
      ignore_whitelist = true;
      disable_monitoring = true;
    }
{% if env.RBL_RESOLVE_IP == 'enabled' %}
    resolved {
      symbol = "RBL_RESOLVED";
      rbl = "resolved.rbl.test";
      checks = ["from", "helo", "rdns", "urls"];
      resolve_ip = true;
      url_full_hostname = true;
      ignore_whitelist = true;
      disable_monitoring = true;
    }
{% endif %}
  }
}

external_relay {
  enabled = {= env.RBL_RELAY_PLUGIN == 'enabled' =};
  rules {
    source_ip {
      symbol = "RBL_TEST_RELAY";
      strategy = "ip_map";
      ip_map = ["192.0.2.10"];
    }
  }
}
