# Regression config for the proxy milter error path.
#
# The proxy has an upstream definition (required by the config parser) but no
# default upstream, so proxy_send_master_message() cannot find a backend and
# takes its error path on every message. That is the same `err:` block that is
# reached in production when all upstreams are in backoff ("cannot select
# upstream"). Before the fix that block dropped the last reference to the
# milter proxy session, freeing it (and the milter session) while the caller
# and the milter library were still using it. See
# test/functional/lua/miltertest/dead_upstream.lua.

options = {
	filters = ["spf", "dkim", "regexp"]
	url_tld = "{= env.URL_TLD =}"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua";
	gtube_patterns = "all";
	dns {
		retransmits = 2;
	}
}
logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
}
metric = {
	name = "default",
	actions = {
		reject = 100500,
	}
	unknown_weight = 1
}
worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	count = 1
	task_timeout = 60s;
}
worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}
worker {
	type = "rspamd_proxy";
	count = 1;
	timeout = 120;
	upstream {
		local {
			# Hosts are mandatory, but this upstream is deliberately not
			# marked as default, so ctx->default_upstream stays NULL and
			# proxy_send_master_message() calls its error path immediately.
			hosts = "{= env.LOCAL_ADDR =}:1";
		}
	}
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_PROXY =}";
	milter = true;
}
modules {
    path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}
lua = "{= env.TESTDIR =}/lua/test_coverage.lua";
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua"
lua = "{= env.TESTDIR =}/lua/params.lua"
lua = "{= env.TESTDIR =}/lua/milter_hdr_fold.lua"
milter_headers {
	extended_spam_headers = true;
	skip_local = false;
	skip_authenticated = false;
}
