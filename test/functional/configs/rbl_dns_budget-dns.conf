options {
  dns {
    # Names without a fake record are asked here: nothing listens, so they fail
    nameserver = ["127.0.0.1:9"];
    timeout = 0.5;
    retransmits = 1;
    fake_records = [
      # native checks, rule zone budget.test
      { name = "4.3.2.1.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "rdns-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "helo-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "reply-budget.org.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "mail-budget.org.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "urla-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "urlb-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      # selectors
      { name = "sel-a-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "sel-b-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "sel-c-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "dup-budget.com.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      # resolve_ip: one name, three addresses, no AAAA
      { name = "multi-budget.com"; type = "a"; replies = ["127.0.0.2", "127.0.0.3", "127.0.0.4"]; },
      { name = "multi-budget.com"; type = "aaaa"; rcode = "norec"; },
      { name = "2.0.0.127.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "3.0.0.127.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "4.0.0.127.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      # hash_format = rbase32: sha256("example.com"), RFC 4648, lowercased
      { name = "un42n5xov642kxrxrqiyanhcoupgql5lt4wtbkyt2ijflbwodfdq.rb32.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "un42n5xov642kxrxrqiyanhcoupgql5l.rb32.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "dup-budget.com.raw.test"; type = "a"; replies = ["127.0.0.3"]; },
      { name = "a-fold.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      { name = "b-other.budget.test"; type = "a"; replies = ["127.0.0.2"]; },
      # resolves to the connecting address: same final query as `from`
      { name = "same-budget.com"; type = "a"; replies = ["1.2.3.4"]; },
      { name = "same-budget.com"; type = "aaaa"; rcode = "norec"; },
      { name = "0c8f73e5d4db4320fb1479c1df831015.raw.test"; type = "a"; replies = ["127.0.0.2"]; },
      # selector_hash = false: the selector value is used as it is
      { name = "0123456789abcdef.raw.test"; type = "a"; replies = ["127.0.0.2"]; },
    ]
  }
}
