.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"

# No non-least rule sets a priority above normal: a rule without priority is
# skipped when its action is already selected, and nothing outranks it, so its
# match stops the scan
force_actions {
	rules {
		FORCE_SAME_REJECT {
			action = "reject";
			expression = "FA_SAME";
		}
		# Nothing outranks a rule without priority here, so it stops the scan
		FORCE_STOP_ADD_HEADER {
			action = "add header";
			expression = "FA_STOP";
		}
		# A least result never outranks a non-least one, whatever its priority
		FORCE_LEAST_CRITICAL_ADD_HEADER {
			action = "add header";
			expression = "FA_LEAST_NEVER";
			priority = "critical";
			least = true;
		}
		# A low rule is outranked by a rule without priority (normal), so it
		# must not suppress the composite of that rule
		FORCE_UNSET_A_LOW_REJECT {
			action = "reject";
			expression = "FA_UNSET_A";
			priority = "low";
		}
		FORCE_UNSET_B_NO_ACTION {
			action = "no action";
			expression = "FA_UNSET_COMPOSITE";
		}
	}
}

composites {
	FA_STOP_WITNESS {
		expression = "FA_STOP";
		score = 0.0;
	}
	FA_UNSET_COMPOSITE {
		expression = "FA_UNSET_A & FA_UNSET_B";
		score = 0.0;
	}
	FA_SAME_WITNESS {
		expression = "FA_SAME";
		score = 0.0;
	}
}

settings {
	id_stop {
		id = "id_stop";
		apply {
			symbols {
				FA_STOP = 0.0;
			}
		}
	}
	id_unset_outranks_low {
		id = "id_unset_outranks_low";
		apply {
			symbols {
				FA_UNSET_A = 0.0;
				FA_UNSET_B = 0.0;
			}
		}
	}
	id_same_reject {
		id = "id_same_reject";
		apply {
			symbols {
				FA_SAME = 0.0;
				FA_SCORE_REJECT = 100500.0;
			}
		}
	}
}
