.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"

# No rule sets a priority, so a rule whose action is already selected is skipped
force_actions {
	rules {
		FORCE_SAME_REJECT {
			action = "reject";
			expression = "FA_SAME";
		}
	}
}

composites {
	FA_SAME_WITNESS {
		expression = "FA_SAME";
		score = 0.0;
	}
}

settings {
	id_same_reject {
		id = "id_same_reject";
		apply {
			symbols {
				FA_SAME = 0.0;
				FA_SCORE_REJECT = 100500.0;
			}
		}
	}
}
