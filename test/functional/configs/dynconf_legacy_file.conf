# Dynamic configuration with its defaults (the file backend) and the file of the previous implementation:
# the suite puts overrides there before the start, the primary controller imports them once.
options = {
	dynamic_conf = "{= env.TMPDIR =}/rspamd_dynamic"
	filters = ["regexp"]
	url_tld = "{= env.TESTDIR =}/../lua/unit/test_tld.dat"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua"
	dns {
		retransmits = 2;
	}
}

modules {
	path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}

# Registers the controller plugins, among them /plugins/dynconf/*
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua";

lang_detection {
	languages = "{= env.INSTALLROOT =}/share/rspamd/languages";
	prefer_fasttext = false;
}

logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
	log_usec = true;
}

# The stock rules add a few points to every message: the thresholds are far above them
# The included file plays override.d/actions.conf (priority 10): its thresholds cannot be changed dynamically
actions {
	reject = 100;
	add_header = 30;
	.include(priority=10) "{= env.TESTDIR =}/configs/dynconf_legacy_override.conf"
}

dynconf {
	interval = 1s;
	jitter = 0.1;
}

regexp {
	DYN_HELLO {
		re = '/hello/{sa_body}',
		score = 2.0,
		group = 'body',
	}
	DYN_WORLD {
		re = '/world/{sa_body}',
		score = 3.0,
		group = 'body',
	}
}

# Two scanning workers: every one of them has to follow the controller
worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	count = 2
	keypair {
		pubkey = "{= env.KEY_PUB1 =}";
		privkey = "{= env.KEY_PVT1 =}";
	}
	task_timeout = 10s;
}

worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}
