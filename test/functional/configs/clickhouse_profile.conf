options = {
  filters = ["spf", "dkim", "regexp"]
  pidfile = "{= env.TMPDIR =}/rspamd.pid"
  lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua"
  dns {
    retransmits = 2;
  }
}
clickhouse {
  # Talks to test/functional/util/dummy_clickhouse.py
  server = "{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_HTTP =}";
  allow_local = true;
  use_gzip = false;
  timeout = 5;
  # A batch is sent about a second after its first row
  check_timeout = 1;
  limits {
    max_rows = 1000;
    max_interval = 1;
  }
  enable_symbols = {= env.CH_ENABLE_SYMBOLS =};
  # Checks that the profile block sits before the extra columns
  extra_columns = [
    {
      name = "ProfTestExtra";
      selector = "ip";
      type = "String";
    }
  ];
  profile {
    # 0 switches the feature off
    sample_rate = {= env.CH_SAMPLE_RATE =};
    groups = ["chprof"];
  }
}
logging = {
  type = "file",
  level = "debug"
  filename = "{= env.TMPDIR =}/rspamd.log"
}
metric = {
  name = "default",
  actions = {
    reject = 100500,
  }
  unknown_weight = 1
}
worker {
  type = normal
  bind_socket = {= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}
  count = 1
  task_timeout = 60s;
}
worker {
  type = controller
  bind_socket = {= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}
  count = 1
  secure_ip = ["127.0.0.1", "::1"];
  stats_path = "{= env.TMPDIR =}/stats.ucl"
}
lua = "{= env.TESTDIR =}/lua/test_coverage.lua";
lua = "{= env.TESTDIR =}/lua/clickhouse_profile.lua";
modules {
  path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua"
