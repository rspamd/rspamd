.include "{= env.TESTDIR =}/configs/lua_test.conf"

multistage {
  key = "test-only-multistage-shared-key-01";
  timeout = 0.2;
  policies = [
    { name = "sender-reject"; symbol = "DATA_REJECT"; action = "reject"; reason = "test sender policy"; },
    { name = "sender-defer"; symbol = "DATA_DEFER"; action = "soft reject"; reason = "test temporary policy"; }
  ];
}
worker {
  type = "rspamd_proxy";
  count = 1;
  bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_PROXY =}";
  milter = true;
  upstream { local { self_scan = true; default = true; } }
}
worker {
  type = "rspamd_proxy";
  count = 1;
  bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER_SSL =}";
  milter = true;
  upstream {
    scanner { hosts = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"; default = true; }
  }
}
worker {
  type = "rspamd_proxy";
  count = 1;
  bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL_SSL =}";
  milter = true;
  allow_file_and_shm_inputs = false;
  upstream {
    scanner { hosts = "{= env.LOCAL_ADDR =}:{= env.PORT_DUMMY_HTTP =}"; default = true; }
  }
}
