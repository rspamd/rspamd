options = {
	filters = ["spf", "dkim", "regexp"]
	url_tld = "{= env.URL_TLD =}"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	dns {
		retransmits = 2;
		# Answered locally: the tests need no network
		fake_records = [{
			name = "coro.resolveme",
			type = "a";
			replies = ["127.0.0.2"];
		}]
	}
}
logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
	log_usec = true;
}
metric = {
	name = "default",
	actions = {
		reject = 100500,
	}
	unknown_weight = 1
}

worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	# One process, so that concurrent scans share the coroutine pool and
	# the symbol callback data, and a crash shows up as a new worker pid
	count = 1
	# Short, so that a coroutine can outlive its task: the sleep tests sleep
	# longer than this; the concurrency test needs about 3.5s at most
	task_timeout = 6s;
}
worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}
lua = "{= env.TESTDIR =}/lua/test_coverage.lua";
lua = "{= env.TESTDIR =}/lua/coroutines.lua";
