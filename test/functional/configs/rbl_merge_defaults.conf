.include(duplicate=merge,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"
.include(duplicate=merge,priority=1) "{= env.TESTDIR =}/configs/rbl_merge_defaults-dns.conf"

rbl {
  # The global opt-out must also reach rules that ignore the other defaults,
  # which is how the stock URIBL/DBL rules are configured
  default_merge_checks = false;
  rbls {
    RBL_NOMERGE_DEFAULT {
      rbl = "merge.test";
      ignore_defaults = true;
      selector = {
        first = "id('example.org')";
        second = "id('example.org')";
      }
    }
    RBL_MERGE_EXPLICIT {
      rbl = "merge.test";
      ignore_defaults = true;
      merge_checks = true;
      selector = {
        first = "id('example.org')";
        second = "id('example.org')";
      }
    }
  }
}

# Scored so that a symbol inserted once per check adds up to twice its weight
group "rbl" {
  symbols = {
    "RBL_NOMERGE_DEFAULT" {
      weight = 1.0;
    }
    "RBL_MERGE_EXPLICIT" {
      weight = 1.0;
    }
  }
}
