# Dynamic configuration is switched off (`enabled = false`) while the deprecated dynamic_conf module has Redis
# servers: setting the backend alone would not apply its data, and the module has to say that.
options = {
	filters = ["regexp", "dynamic_conf"]
	url_tld = "{= env.TESTDIR =}/../lua/unit/test_tld.dat"
	pidfile = "{= env.TMPDIR =}/rspamd.pid"
	lua_path = "{= env.INSTALLROOT =}/share/rspamd/lib/?.lua"
	dns {
		retransmits = 2;
	}
}

modules {
	path = "{= env.TESTDIR =}/../../src/plugins/lua/"
}

# Registers the controller plugins, among them /plugins/dynconf/*
lua = "{= env.INSTALLROOT =}/share/rspamd/rules/rspamd.lua";

lang_detection {
	languages = "{= env.INSTALLROOT =}/share/rspamd/languages";
	prefer_fasttext = false;
}

logging = {
	type = "file",
	level = "debug"
	filename = "{= env.TMPDIR =}/rspamd.log"
	log_usec = true;
	log_severity = true;
}

# The stock rules add a few points to every message: the thresholds are far above them.
# The included file plays override.d: its priority (10) is higher than the one of a dynamic threshold (3)
actions {
	reject = 100;
	add_header = 30;
	.include(priority=10) "{= env.TESTDIR =}/configs/dynconf_override_actions.conf"
}

# The module of the previous implementation: the backend is `file`, so its Redis data is not applied,
# and the module says so. Nothing connects to that address: the stub only reads the section.
dynamic_conf {
	servers = "127.0.0.1:1";
}

dynconf {
	enabled = false;
}

regexp {
	DYN_CA {
		re = '/compalpha/{sa_body}',
		score = 1.0,
		group = 'body',
	}
	DYN_CB {
		re = '/compbeta/{sa_body}',
		score = 1.0,
		group = 'body',
	}
	DYN_HELLO {
		re = '/hello/{sa_body}',
		score = 2.0,
		group = 'body',
	}
	DYN_WORLD {
		re = '/world/{sa_body}',
		score = 3.0,
		group = 'body',
	}
}

# The default policy of a composite removes the atoms that it has matched
composites {
	DYN_AB {
		expression = "DYN_CA & DYN_CB";
		score = 5.0;
	}
}

# Two scanning workers: every one of them has to follow the controller
worker {
	type = normal
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_NORMAL =}"
	count = 2
	keypair {
		pubkey = "{= env.KEY_PUB1 =}";
		privkey = "{= env.KEY_PVT1 =}";
	}
	task_timeout = 10s;
}

worker {
	type = controller
	bind_socket = "{= env.LOCAL_ADDR =}:{= env.PORT_CONTROLLER =}"
	count = 1
	secure_ip = ["127.0.0.1", "::1"];
	stats_path = "{= env.TMPDIR =}/stats.ucl"
}
