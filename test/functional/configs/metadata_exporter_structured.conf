# Config for metadata_exporter structured formatter functional tests
.include(duplicate=append,priority=0) "{= env.TESTDIR =}/configs/plugins.conf"

lua = "{= env.LUA_SCRIPT =}";
redis {
  servers = "{= env.REDIS_ADDR =}:{= env.REDIS_PORT =}";
}

# Configure metadata_exporter with structured formatter and redis_stream backend
metadata_exporter {
  custom_variables {
    # Spaces make it neither an address nor a bare local part
    invalid_recipient = "return function() return 'not an address' end";
    loopback = "return function() return '127.0.0.1' end";
    stream_key = "return function() return 'test:structured' end";
    stream_zstd_key = "return function() return 'test:structured_zstd' end";
    template_value = "return function() return 'template-custom' end";
    unused_failure = "return function() error('unused custom variable evaluated') end";
    parts_text = "return function() return 'Prüfung ergab: alles in Ordnung.' end";
    parts_binary = "return function() return string.char(0,1,2,3,4,5,6,7,255,254,253) .. string.rep('B', 200) end";
    parts_number = "return function() return 42 end";
    parts_empty = "return function() return '' end";
    parts_list = "return function() return {'alpha', 'beta', 'gamma'} end";
    parts_dotline = "return function() return 'before\\n.\\nafter' end";
    parts_longname = "return function() return 'payload' end";
    # CR/LF from a custom variable must not start a new header
    inject_value = "return function() return 'safe\\r\\nBcc: injected@example.com' end";
    # Placeholder-like data in a value must stay literal
    literal_value = "return function() return 'cost $100 ${user} $ip' end";
    # A custom variable that raises must count as a failure, not escape
    boom = "return function(task) local t = nil; return t.x end";
    invalid_non_string = 42;
    # Valid Lua that yields no callback: must be reported, not thrown
    invalid_no_callback = "local x = 1";
  }
  custom_push {
    verify_options = <<EOD
local logger = require 'rspamd_logger'
return function(task, _, rule)
  local checks = {
    -- routing values are expanded from custom variables and selectors
    mail_from = rule.mail_from == 'sender@example.com',
    mail_to = rule.mail_to[1] == 'template-custom',
    helo = rule.helo == 'selector-test@example.com',
    channel = rule.channel == 'template-custom',
    stream_key = rule.stream_key == 'selector-test@example.com',
    -- connection, credential and behaviour values must stay literal
    url = rule.url == '$template_value/${user}',
    host = rule.host == '$loopback',
    smtp = rule.smtp == '$loopback',
    user = rule.user == '$template_value',
    password = rule.password == '${user}',
    mime_type = rule.mime_type == '$template_value',
    meta_header_prefix = rule.meta_header_prefix == '${user}',
    port = type(rule.port) == 'number' and rule.port == 11126,
    smtp_port = type(rule.smtp_port) == 'number' and rule.smtp_port == 11126,
    timeout = type(rule.timeout) == 'number' and rule.timeout == 5,
    max_len = type(rule.max_len) == 'number' and rule.max_len == 100,
    gzip = rule.gzip == true,
    keepalive = rule.keepalive == false,
    zstd_compress = rule.zstd_compress == true,
    -- a custom backend gets options the built-in ones do not know
    custom_token = rule.custom_token == 'opaque',
  }
  local failed = {}
  for name, valid in pairs(checks) do
    if not valid then
      failed[#failed + 1] = name
    end
  end
  if #failed == 0 then
    logger.messagex(task, 'METADATA_OPTIONS_EXPANDED')
  else
    logger.messagex(task, 'METADATA_OPTIONS_%s: %s', 'FAILED', table.concat(failed, ','))
  end
end
EOD;
  }
  custom_select {
    email_test = "return function(task) return task:get_user() == 'selector-test@example.com' end";
    defer_test = "return function(task) return task:get_user() == 'defer-test@example.com' end";
    defer_throw_test = "return function(task) return task:get_user() == 'defer-throw@example.com' end";
  }
  rules {
    STRUCTURED_EXPORT {
      backend = "redis_stream";
      formatter = "structured";
      stream_key = "$stream_key";
      max_len = 100;
      per_recipient = false;
      selector = "default";
    }
    STRUCTURED_EXPORT_ZSTD {
      backend = "redis_stream";
      formatter = "structured";
      zstd_compress = true;
      stream_key = "$stream_zstd_key";
      max_len = 100;
      selector = "default";
    }
    EMAIL_EXPORT {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11126;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      # A bare local part (RFC 5321 postmaster) is a valid target
      mail_to = ["${rcpts:addr}", "$invalid_recipient", "postmaster"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nX-Custom: $template_value\nX-Selector: ${user}\nX-Injected: $inject_value\nX-List: $parts_list\nX-Literal: $literal_value\nX-Hosts: host-alpha,host-beta,host-gamma,host-delta,host-epsilon,host-zeta,host-eta\n\nMetadata alert\nList: ${parts_list}\nLiteral: ${literal_value}";
      email_alert_sender_variable = "invalid_recipient";
      selector = "email_test";
    }
    EMAIL_EXPORT_ENCODED_HEADERS {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11127;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: \"Jörg Müller\" <$mail_from>\nTo: \"Änne Example\" <first@example.com>, <second@example.com>\nCc: Jörg <third@example.com> (Kommentär)\nReply-To: Gruppe Ä: <a@example.com>, \"Ö (x)\" <b@example.com>;\nSubject: Prüfung möglich\nX-Report: Prüfung for 1,000,000 messages from host-alpha,host-beta,host-gamma,host-delta,host-epsilon\n\nMetadata alert";
      selector = "email_test";
    }
    EMAIL_EXPORT_PARTS {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11128;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nMIME-Version: 1.0\nMessage-ID: <$our_message_id>\nSubject: Parts export\n";
      email_parts_type = "mixed";
      email_parts = [
        {
          content_from_variables = "parts_text";
          content_type = "text/plain; charset=utf-8";
          encoding = "7bit";
        },
        {
          content_from_variables = "parts_binary";
          filename = "Bericht ö ${user}.zip";
          content_type = "application/zip";
        },
        {
          content_from_variables = "parts_number";
          content_type = "text/plain";
          encoding = "7bit";
        },
        {
          content_from_variables = "parts_empty";
          content_type = "application/octet-stream";
        },
        # SMTP dot-stuffing preserves a bare "." line without changing CTE
        {
          content_from_variables = "parts_dotline";
          content_type = "text/plain; charset=utf-8";
          encoding = "8bit";
        },
        # Long filename must be split into RFC 2231 continuation sections
        # rather than emitted as one over-long header line
        {
          content_from_variables = "parts_longname";
          content_type = "application/octet-stream";
          filename = "Jahresabschlussbericht-Ärger-mit-Umlauten-und-sehr-langem-Namen-für-die-Ablage-2026-Quartal-vier-final.zip";
        }
      ];
      selector = "email_test";
    }
    # The template's body MIME headers move to its leading multipart part.
    # parts_list returns a table and must be flattened into body text.
    # auto_grouping = false keeps this test focused on header-preservation
    # rather than the multipart/alternative auto-grouping tested separately.
    EMAIL_EXPORT_PARTS_DEFAULT {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11129;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nMIME-Version: 1.0\nContent-Type: text/html; charset=utf-8\nContent-Transfer-Encoding: 8bit\nSubject: HTML parts export\n\n<p>Grüße</p>";
      auto_grouping = false;
      email_parts = [
        {
          content_from_variables = "parts_list";
          content_type = "text/plain; charset=utf-8";
        }
      ];
      selector = "email_test";
    }
    # A `content` part (as opposed to content_from_variables) is expanded via
    # variables/selectors and lua_util.template, exactly like the template body
    EMAIL_EXPORT_CONTENT {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11132;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nMIME-Version: 1.0\nMessage-ID: <$our_message_id>\nSubject: Literal content export\n";
      email_parts = [
        {
          content = "Static literal line one.\nHost is $loopback and template value is $template_value.";
          content_type = "text/plain; charset=utf-8";
          filename = "$user-$template_value.txt";
          encoding = "7bit";
        }
      ];
      selector = "email_test";
    }
    # A text/plain + text/html pair auto-groups into a nested
    # multipart/alternative, with the zip attachment staying a sibling in the
    # outer multipart/mixed
    EMAIL_EXPORT_ALTERNATIVE {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11134;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nMIME-Version: 1.0\nMessage-ID: <$our_message_id>\nSubject: Alternative export\nContent-Type: text/html; charset=utf-8\nContent-Disposition: ATTACHMENT; filename=\"template.html\"\n\n<p>Attached template body.</p>";
      email_parts = [
        {
          content = "Plain alternative body.";
          content_type = "text/plain; charset=utf-8";
          encoding = "7bit";
        },
        {
          content = "<p>HTML alternative body.</p>";
          content_type = "text/html; charset=utf-8";
          encoding = "7bit";
        },
        {
          content_from_variables = "parts_binary";
          filename = "attachment.zip";
          content_type = "application/zip";
        }
      ];
      selector = "email_test";
    }
    # A text/plain + text/html pair with nothing else becomes a top-level
    # multipart/alternative containing those two parts directly
    EMAIL_EXPORT_ALTERNATIVE_ONLY {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11135;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nMIME-Version: 1.0\nMessage-ID: <$our_message_id>\nSubject: Alternative only export\n";
      email_parts = [
        {
          content = "Plain only body.";
          content_type = "text/plain; charset=utf-8";
          encoding = "7bit";
        },
        {
          content = "<p>HTML only body.</p>";
          content_type = "text/html; charset=utf-8";
          encoding = "7bit";
        }
      ];
      selector = "email_test";
    }
    # Unknown key -> rejected by the schema and disabled at startup, other rules unaffected
    INVALID_RULE_BAD_KEY {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11133;
      mail_to = "postmaster@example.com";
      totally_unknown_option = true;
    }
    INVALID_PART_BOTH_SOURCES {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      mail_to = "postmaster@example.com";
      email_parts = [{ content = "literal"; content_from_variables = "parts_text"; }];
    }
    INVALID_PART_NO_SOURCE {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      mail_to = "postmaster@example.com";
      email_parts = [{ content_type = "text/plain"; }];
    }
    # An 8bit body goes out unchanged when the server advertises 8BITMIME
    EMAIL_EXPORT_8BITMIME {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11130;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nContent-Type: text/plain; charset=utf-8\nContent-Transfer-Encoding: 8bit\n\nMetadata alert: Grüße";
      selector = "email_test";
    }
    # ... and is converted to quoted-printable when it does not (RFC 6152)
    EMAIL_EXPORT_HELO_FALLBACK {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11131;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nContent-Type: text/plain; charset=utf-8\nContent-Transfer-Encoding: 8bit\n\nMetadata alert: Grüße";
      selector = "email_test";
    }
    # Raw 8-bit headers cannot be converted for a server without 8BITMIME,
    # so the send must fail before MAIL FROM
    EMAIL_EXPORT_NO_DOWNGRADE {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11136;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_auto_encode_headers = false;
      email_template = "From: <$mail_from>\nTo: $mail_to\nSubject: Grüße\n\nMetadata alert";
      selector = "email_test";
    }
    # A non-ASCII address cannot be RFC 2047-encoded: the alert is refused
    # (nothing listens on this port, so a send attempt would only log an error)
    EMAIL_EXPORT_UNENCODABLE {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11137;
      helo = "${user}";
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: Jörg <jörg@example.com>\n\nMetadata alert";
      selector = "email_test";
    }
    VERIFY_OPTIONS {
      backend = "verify_options";
      formatter = "default";
      selector = "email_test";
      mail_from = "${from('smtp'):addr}";
      mail_to = ["$template_value"];
      helo = "${user}";
      channel = "$template_value";
      stream_key = "${user}";
      url = "$template_value/${user}";
      host = "$loopback";
      smtp = "$loopback";
      user = "$template_value";
      password = "${user}";
      mime_type = "$template_value";
      meta_header_prefix = "${user}";
      port = 11126;
      smtp_port = 11126;
      timeout = 5;
      max_len = 100;
      gzip = true;
      keepalive = false;
      zstd_compress = true;
      custom_token = "opaque";
    }
    # The default template has a text/plain body, which together with these
    # parts gives two text/plain grouping candidates
    INVALID_AMBIGUOUS_TEMPLATE {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      mail_to = "postmaster@example.com";
      email_parts = [
        { content = "plain"; content_type = "text/plain"; },
        { content = "<p>html</p>"; content_type = "text/html"; }
      ];
    }
    # Template content headers move into the first part; non-ASCII there has
    # no RFC 2047 form either (nothing listens on this port)
    EMAIL_EXPORT_PART_HEADER {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11137;
      timeout = 5;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nContent-Type: text/plain; charset=utf-8; name=\"Prüfung.txt\"\n\nTemplate body";
      email_parts = [{ content = "part"; content_type = "application/octet-stream"; }];
      selector = "email_test";
    }
    # A literal mail_from that is not an address is a configuration error
    INVALID_MAIL_FROM {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      mail_from = "not an address";
      mail_to = "postmaster@example.com";
    }
    # A custom variable that raises while building a part defers like any
    # other alert that cannot be built
    EMAIL_EXPORT_DEFER_THROW {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11137;
      timeout = 5;
      defer = true;
      mail_from = "${from('smtp'):addr}";
      mail_to = ["${rcpts:addr}"];
      email_template = "From: <$mail_from>\nTo: $mail_to\nSubject: throw\n";
      email_parts = [{ content_from_variables = "boom"; content_type = "application/octet-stream"; }];
      selector = "defer_throw_test";
    }
    # An alert that cannot be built counts as a failed push for defer
    EMAIL_EXPORT_DEFER {
      backend = "send_mail";
      formatter = "email_alert";
      smtp = "127.0.0.1";
      smtp_port = 11137;
      timeout = 5;
      defer = true;
      mail_from = "$invalid_recipient";
      mail_to = ["${rcpts:addr}"];
      selector = "defer_test";
    }
  }
}
